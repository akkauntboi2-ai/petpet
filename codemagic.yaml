workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.petshopx2025.app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Clean iOS build
        script: |
          cd ios && rm -rf Pods Podfile.lock .symlinks && cd ..
          flutter clean && flutter pub get
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - saidtadjievfaris@icloud.com
