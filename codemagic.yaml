workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.petshopx2025.app"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.petshopx2025.app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Clean iOS
        script: |
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock .symlinks Podfile
          cd ..
          flutter clean
          flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - saidtadjievfaris@icloud.com
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
