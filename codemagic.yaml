workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      groups:
        - appstore_credentials
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.petshopx2025.app" --type IOS_APP_STORE --create --certificate-key=@env:CM_CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles --export-options-plist=$HOME/export_options.plist
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate app icons
        script: |
          dart run flutter_launcher_icons
      - name: Clean iOS build
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          rm -rf .symlinks
          rm -rf Flutter/Flutter.podspec
          cd ..
          flutter clean
          flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - saidtadjievfaris@icloud.com
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
