workflows:
  ios-test:
    name: iOS Test Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Migrate to Swift Package Manager
        script: |
          cd ios
          # Remove CocoaPods completely
          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock
          rm -f .symlinks
          rm -rf Flutter/ephemeral
          # Remove Podfile to force SPM
          rm -f Podfile
          cd ..
      - name: Clean Flutter
        script: |
          flutter clean
          flutter pub get
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Create unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r PetPet_unsigned.ipa Payload
          mv PetPet_unsigned.ipa ../../../
    artifacts:
      - "*.ipa"
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - saidtadjievfaris@icloud.com
