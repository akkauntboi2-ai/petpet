workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: PetPet
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Flutter build iOS
        script: flutter build ios --release --no-codesign
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.petshopx2025.app" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --project=ios/Runner.xcodeproj \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Build IPA
        script: |
          mkdir -p build/ios/ipa
          cd ios && xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $HOME/Runner.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath $HOME/Runner.xcarchive \
            -exportPath $HOME/build \
            -exportOptionsPlist /Users/builder/export_options.plist
          cp $HOME/build/*.ipa ../build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - saidtadjievfaris@icloud.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
