workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "com.petshopx2025.app"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "A899CQL63F"
        APP_STORE_CONNECT_ISSUER_ID: "e1f98c09-18c3-4d1a-91e2-cace11d10093"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgc/D9bGNuNJ5cZRbw
          B6lR+r8/FoPUaBEfRuvogE8fXK2gCgYIKoZIzj0DAQehRANCAARSf/ywUg8HL1YI
          1tTrA4rwU6utA7g2dbyqilw0K/9nMY1AL9lVM6L2mU3gwLi9xzMtFUZDB3W675VP
          1PVKIxHg
          -----END PRIVATE KEY-----
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.petshopx2025.app
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Clean iOS
        script: |
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock .symlinks Podfile
          cd ..
          flutter clean
          flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - saidtadjievfaris@icloud.com
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
